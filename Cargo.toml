[package]
name = "capsnav"
version = "0.1.0"
edition = "2021"
authors = ["muu0726"]
description = "A lightweight cross-platform resident utility converting CapsLock + IJKL into arrow keys with CapsLock fully suppressed."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/muu0726/capsnav.git"

[dependencies]
log = "0.4"
env_logger = "0.11"
ctrlc = "3.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.24"
