[package]
name = "capsnav"
version = "0.2.0"
edition = "2021"
authors = ["muu0726"]
description = "A resident cross-platform system tray utility converting CapsLock + IJKL into arrow keys with CapsLock fully suppressed."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/muu0726/capsnav.git"

[dependencies]
log = "0.4"
env_logger = "0.11"
ctrlc = "3.4"
tray-icon = "0.26"
tao = "0.37"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }

